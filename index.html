<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bureau Windows</title>
    <style>
        /* Base et Bureau */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: url('https://w.wallhaven.cc/full/ex/wallhaven-ex9wvo.jpg') center/cover no-repeat;
            background-color: #0b0b0b;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; user-select: none;
        }

        /* Écran de verrouillage pour activer l'audio */
        #lock-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; cursor: pointer; transition: opacity 0.5s;
        }
        #lock-screen h1 { font-size: 3rem; margin-bottom: 10px; }
        #lock-screen p { font-size: 1.2rem; animation: pulse 1.5s infinite; }

        /* Barre des tâches & Icônes (Personnalisées) */
        .taskbar {
            position: absolute; bottom: 0; width: 100%; height: 48px;
            background: rgba(32, 32, 32, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; padding: 0 15px; z-index: 50;
        }
        .start-btn { width: 36px; height: 36px; background: #0078D7; border-radius: 4px; }
        
        .desktop-icons {
            display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start;
            height: calc(100% - 48px); padding: 15px; gap: 20px;
        }
        .icon { width: 80px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .icon-img { width: 48px; height: 48px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; margin-bottom: 5px; }
        .icon-text { color: white; font-size: 12px; text-shadow: 1px 1px 3px black; text-align: center; word-wrap: break-word; width: 100%; }

        /* Fenêtres d'Erreur Modernes */
        .error-window {
            position: absolute; width: 350px; background: #ffffff;
            border: 1px solid #dcdcdc; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 100; border-radius: 6px; overflow: hidden;
            animation: popIn 0.1s ease-out;
        }
        .error-header {
            background: #f3f3f3; padding: 8px 12px; display: flex; justify-content: space-between;
            font-size: 13px; color: #333; border-bottom: 1px solid #e5e5e5;
        }
        .error-close { color: #000; cursor: pointer; font-weight: bold; }
        .error-close:hover { color: red; }
        .error-body { padding: 20px; display: flex; align-items: center; gap: 15px; font-size: 14px; color: #000; }
        .error-icon { background: #e81123; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; }

        /* L'entité (Jumpscare) */
        #monster-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: none; justify-content: center; align-items: center; overflow: hidden;
        }
        #monster-img {
            /* Têtes beaucoup plus grosses */
            width: 150vw; 
            height: 150vh;
            object-fit: contain;
            transition: all 0.1s;
        }

        /* Animations */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .shake-screen { animation: violent-shake 0.1s infinite; filter: saturate(200%) contrast(150%) hue-rotate(-20deg); }
        @keyframes violent-shake {
            0% { transform: translate(5px, 5px); } 25% { transform: translate(-5px, -5px) scale(1.02); }
            50% { transform: translate(5px, -5px); } 75% { transform: translate(-5px, 5px) scale(0.98); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div id="lock-screen" onclick="startExperience()">
        <h1>16:09</h1>
        <p>Cliquez n'importe où pour déverrouiller</p>
    </div>

    <!-- Faux Bureau -->
    <div class="desktop-icons">
        <div class="icon"><div class="icon-img"></div><div class="icon-text">Valorant_1440x1080</div></div>
        <div class="icon"><div class="icon-img"></div><div class="icon-text">Roblox_DOORS</div></div>
        <div class="icon"><div class="icon-img"></div><div class="icon-text">LM_Studio_14B</div></div>
        <div class="icon"><div class="icon-img"></div><div class="icon-text">Script_FearsToFathom.docx</div></div>
        <div class="icon"><div class="icon-img"></div><div class="icon-text">Rapport_Credit_Agricole.pdf</div></div>
    </div>
    <div class="taskbar"><div class="start-btn"></div></div>

    <div id="popups-container"></div>

    <!-- Le Monstre -->
    <div id="monster-container">
        <img id="monster-img" src="" alt="Entity">
    </div>

    <script>
        const popupsContainer = document.getElementById('popups-container');
        const monsterContainer = document.getElementById('monster-container');
        const monsterImg = document.getElementById('monster-img');
        const body = document.body;

        // Générateur de sons (Web Audio API)
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playErrorSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); // Son grave d'erreur
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function playScreamerSound() {
            if (!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 3; // 3 secondes de bruit
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1; // Bruit blanc distordu
            }
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gainNode = audioCtx.createGain();
            
            // Filtre pour rendre le bruit strident
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;

            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime);
            noise.start();
        }

        // Système de Pop-ups
        const errorMessages = [
            "L'accès à ce fichier est corrompu.",
            "A-90_PROCESS.EXE ne répond pas.",
            "Erreur de pagination réseau.",
            "Ne te retourne pas.",
            "SYSTÈME COMPROMIS"
        ];

        function spawnPopup() {
            playErrorSound();
            const popup = document.createElement('div');
            popup.className = 'error-window';
            const x = Math.random() * (window.innerWidth - 350);
            const y = Math.random() * (window.innerHeight - 200);
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;
            const msg = errorMessages[Math.floor(Math.random() * errorMessages.length)];
            popup.innerHTML = `
                <div class="error-header"><span>Erreur Critique</span><span class="error-close">✕</span></div>
                <div class="error-body"><div class="error-icon">!</div><span>${msg}</span></div>
            `;
            popupsContainer.appendChild(popup);
        }

        // Lancement principal
        function startExperience() {
            document.getElementById('lock-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 500);
            initAudio();

            // 1. Début calme, popups lents
            setTimeout(() => {
                spawnPopup();
                let speed = 1000;
                
                // 2. Accélération progressive
                const accelerate = () => {
                    spawnPopup();
                    speed = speed * 0.75;
                    if (speed > 80) {
                        setTimeout(accelerate, speed);
                    } else {
                        // Glitch total
                        body.classList.add('shake-screen');
                        let spam = setInterval(spawnPopup, 50);
                        
                        // 3. Apparition du monstre
                        setTimeout(() => {
                            clearInterval(spam);
                            triggerMonsterSequence();
                        }, 2000);
                    }
                };
                setTimeout(accelerate, speed);
            }, 1500);
        }

        function triggerMonsterSequence() {
            // Nettoyage de l'écran
            body.classList.remove('shake-screen');
            popupsContainer.innerHTML = '';
            monsterContainer.style.display = 'flex';
            
            // Phase 1 : Idle (2 secondes, fixe l'utilisateur)
            monsterImg.src = 'ransom_idle.png';
            monsterImg.style.transform = 'scale(1)';
            monsterContainer.style.backgroundColor = '#050000';
            
            setTimeout(() => {
                // Phase 2 : Attaque (Bruit strident, images géantes, alternance lente)
                playScreamerSound();
                monsterContainer.style.backgroundColor = '#000000';
                
                const attackFrames = ['ransom_random.png', 'ransom_attack.png'];
                let toggle = false;

                // Vitesse plus lente (250ms) avec des têtes immenses
                setInterval(() => {
                    monsterImg.src = attackFrames[toggle ? 1 : 0];
                    // Effet de zoom agressif aléatoire
                    const randomScale = 1 + (Math.random() * 0.5); // Entre x1 et x1.5 de la taille originale (qui est déjà énorme)
                    const randomX = (Math.random() * 20 - 10) + 'px';
                    const randomY = (Math.random() * 20 - 10) + 'px';
                    
                    monsterImg.style.transform = `scale(${randomScale}) translate(${randomX}, ${randomY})`;
                    monsterImg.style.filter = toggle ? 'invert(100%) contrast(200%)' : 'contrast(150%) hue-rotate(20deg)';
                    
                    toggle = !toggle;
                }, 250);
                
            }, 2000);
        }
    </script>
</body>
</html>
